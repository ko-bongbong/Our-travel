<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f4ee">

<title>OUR TRAVEL · BOHOL</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --bg:#f1eee7;
  --paper:#faf8f3;
  --card:#ffffff;
  --text:#22221f;
  --muted:#8d8980;
  --line:#ebe6dd;

  --green:#37766d;
  --green-soft:#e6f0ed;

  --sand:#d9c49d;
  --sand-soft:#f3ecdf;

  --orange:#c67e42;
  --orange-soft:#f7ebdf;

  --shadow:0 10px 30px rgba(38,35,29,.07);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Pretendard",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:480px;
  min-height:100vh;
  margin:0 auto;
  padding-bottom:105px;

  background:var(--paper);
  box-shadow:0 0 50px rgba(0,0,0,.06);
}


/* =========================
   TOP
========================= */

.hero{
  position:relative;
  min-height:360px;
  padding:22px 20px 28px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  color:#fff;

  background:
    linear-gradient(
      to bottom,
      rgba(17,30,29,.08),
      rgba(17,30,29,.15) 42%,
      rgba(14,25,24,.88)
    ),
    url("https://images.unsplash.com/photo-1544550285-f813152fb2fd?auto=format&fit=crop&w=1400&q=88")
    center/cover no-repeat;
}

.hero::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  pointer-events:none;

  background:
    linear-gradient(
      to bottom,
      rgba(250,248,243,0),
      var(--paper)
    );
}

.hero-top,
.hero-bottom{
  position:relative;
  z-index:2;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:35px;
  height:35px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.45);
  backdrop-filter:blur(9px);
}

.brand-mark svg{
  width:17px;
}

.logo{
  font-size:11px;
  font-weight:800;
  letter-spacing:4px;
}

.hero-kicker{
  font-size:11px;
  letter-spacing:2px;
  opacity:.8;
}

.hero h1{
  margin:7px 0 8px;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:58px;
  line-height:.95;
  font-weight:500;
  letter-spacing:-2px;
}

.hero-date{
  display:flex;
  align-items:center;
  gap:8px;

  flex-wrap:wrap;

  color:rgba(255,255,255,.88);
  font-size:13px;
}

.hero-chip{
  width:max-content;
  max-width:100%;

  margin-top:15px;
  padding:9px 12px;

  display:flex;
  align-items:center;
  gap:7px;

  border-radius:999px;

  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(10px);

  font-size:11px;
  font-weight:700;
}

.hero-chip svg{
  width:14px;
}


/* =========================
   SUMMARY
========================= */

.trip-summary{
  position:relative;
  z-index:5;

  margin:-27px 17px 0;
  padding:16px 10px;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  background:#fff;
  border-radius:21px;
  box-shadow:var(--shadow);
}

.summary-item{
  text-align:center;
  padding:3px;
}

.summary-icon{
  width:35px;
  height:35px;
  margin:0 auto 7px;

  display:grid;
  place-items:center;

  border-radius:12px;
  background:var(--green-soft);
  color:var(--green);
}

.summary-icon svg{
  width:17px;
}

.summary-item strong{
  display:block;
  font-size:13px;
}

.summary-item span{
  display:block;
  margin-top:3px;

  color:var(--muted);
  font-size:9px;
}


/* =========================
   PAGE
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.content{
  padding:25px 17px 0;
}

.section-header{
  margin-bottom:14px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.section-icon{
  width:38px;
  height:38px;
  flex:none;

  display:grid;
  place-items:center;

  border-radius:13px;
  background:var(--green-soft);
  color:var(--green);
}

.section-icon svg{
  width:18px;
}

.section-title h2{
  margin:0;
  font-size:20px;
  letter-spacing:-.5px;
}

.section-title small{
  display:block;
  margin-top:2px;

  color:var(--muted);
  font-size:9px;
  letter-spacing:.8px;
}


/* =========================
   COMMON CARD
========================= */

.card{
  background:#fff;

  border:1px solid rgba(225,220,210,.8);
  border-radius:20px;

  padding:17px;
  margin-bottom:12px;

  box-shadow:0 5px 18px rgba(34,32,28,.045);
}

.card-title{
  font-size:15px;
  font-weight:850;
  letter-spacing:-.25px;
}

.label{
  display:flex;
  align-items:center;
  gap:5px;

  margin-bottom:7px;

  color:var(--muted);

  font-size:9px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.label svg{
  width:13px;
}

.sub{
  margin-top:5px;
  color:#75726b;
  font-size:12px;
  line-height:1.6;
}

.edit-btn{
  border:0;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;

  padding:8px 11px;

  border-radius:999px;

  background:#f0eee9;
  color:#59564f;

  font-size:10px;
  font-weight:800;
}

.edit-btn svg{
  width:12px;
}

.primary-btn{
  width:100%;
  border:0;

  padding:14px;

  border-radius:14px;

  background:var(--green);
  color:#fff;

  font-size:13px;
  font-weight:800;
}


/* =========================
   HOME MENU
========================= */

.home-menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.home-card{
  min-height:130px;

  border:0;
  padding:15px;

  text-align:left;

  position:relative;
  overflow:hidden;

  background:#fff;
  border-radius:19px;

  box-shadow:0 5px 18px rgba(30,28,24,.05);
  border:1px solid rgba(226,221,212,.8);
}

.home-card-icon{
  width:38px;
  height:38px;

  display:grid;
  place-items:center;

  border-radius:13px;

  background:var(--green-soft);
  color:var(--green);
}

.home-card-icon svg{
  width:18px;
}

.home-card h3{
  margin:13px 0 4px;
  font-size:14px;
}

.home-card p{
  margin:0;

  color:var(--muted);

  font-size:10px;
  line-height:1.5;
}

.home-card-arrow{
  position:absolute;
  right:13px;
  bottom:13px;

  color:#bbb6ad;
}

.home-card-arrow svg{
  width:16px;
}


/* =========================
   HOME FLIGHT
========================= */

.flight-home{
  margin-top:22px;
}

.flight-mini{
  position:relative;
  overflow:hidden;
}

.flight-mini-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.airline{
  font-size:16px;
  font-weight:850;
}

.flight-number{
  padding:5px 8px;

  border-radius:8px;

  background:var(--green-soft);
  color:var(--green);

  font-size:10px;
  font-weight:850;
}

.flight-times{
  margin-top:17px;

  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
}

.flight-point:last-child{
  text-align:right;
}

.flight-time{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:25px;
  font-weight:700;
}

.flight-airport{
  margin-top:3px;
  font-size:11px;
  font-weight:800;
}

.flight-date{
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}

.flight-line{
  position:relative;
  height:40px;
}

.flight-line::before{
  content:"";

  position:absolute;
  left:3px;
  right:3px;
  top:20px;

  border-top:1px dashed #bbb6ad;
}

.flight-plane{
  position:absolute;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:29px;
  height:29px;

  display:grid;
  place-items:center;

  background:#fff;

  border:1px solid var(--line);
  border-radius:50%;

  color:var(--green);
}

.flight-plane svg{
  width:14px;
}

.flight-info{
  margin-top:14px;
  padding-top:12px;

  border-top:1px solid var(--line);

  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.info-chip{
  padding:6px 8px;

  border-radius:9px;

  background:#f5f2ec;
  color:#6d6961;

  font-size:9px;
  font-weight:700;
}


/* =========================
   SCHEDULE
========================= */

.schedule-card{
  padding:0;
  overflow:hidden;
}

.schedule-wrap{
  display:flex;
}

.schedule-date{
  width:72px;
  flex:none;

  padding:18px 8px;

  text-align:center;

  background:#f3f0e9;

  border-right:1px solid var(--line);
}

.schedule-date strong{
  display:block;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:21px;
}

.schedule-date span{
  display:block;

  margin-top:5px;

  color:var(--muted);
  font-size:8px;
  letter-spacing:.8px;
}

.schedule-body{
  flex:1;
  padding:16px;
}

.schedule-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.schedule-icon{
  width:31px;
  height:31px;
  flex:none;

  display:grid;
  place-items:center;

  border-radius:10px;

  background:var(--green-soft);
  color:var(--green);
}

.schedule-icon svg{
  width:15px;
}

.schedule-memo{
  margin-top:6px;

  white-space:pre-wrap;

  color:#77736b;
  font-size:12px;
  line-height:1.6;
}

.schedule-edit{
  margin-top:11px;
}


/* =========================
   HOTELS
========================= */

.hotel-card{
  padding:0;
  overflow:hidden;
}

.hotel-image{
  height:170px;

  position:relative;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.03),
      rgba(0,0,0,.22)
    ),
    url("https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1000&q=85")
    center/cover no-repeat;
}

.hotel-image.main{
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.03),
      rgba(0,0,0,.22)
    ),
    url("https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&w=1000&q=85")
    center/cover no-repeat;
}

.hotel-tag{
  position:absolute;
  left:12px;
  bottom:12px;

  padding:7px 9px;

  border-radius:999px;

  background:rgba(255,255,255,.92);

  font-size:9px;
  font-weight:850;
}

.hotel-body{
  padding:16px;
}

.hotel-dates{
  display:flex;
  align-items:center;
  gap:6px;

  margin-top:9px;

  color:#747169;
  font-size:11px;
}

.hotel-dates svg{
  width:13px;
  color:var(--green);
}


/* =========================
   MEALS
========================= */

.date-tabs{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding-bottom:6px;
  margin-bottom:13px;

  scrollbar-width:none;
}

.date-tabs::-webkit-scrollbar{
  display:none;
}

.date-tab{
  border:0;

  min-width:63px;
  padding:9px 10px;

  background:#eeebe5;
  color:#7c786f;

  border-radius:999px;

  font-size:10px;
  font-weight:800;
}

.date-tab.active{
  background:var(--green);
  color:#fff;
}

.meal-card{
  position:relative;
}

.meal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:12px;
}

.meal-title{
  display:flex;
  align-items:center;
  gap:9px;
}

.meal-icon{
  width:34px;
  height:34px;

  display:grid;
  place-items:center;

  border-radius:11px;

  background:var(--orange-soft);
  color:var(--orange);
}

.meal-icon svg{
  width:16px;
}

.meal-title strong{
  font-size:14px;
}

.meal-empty{
  color:#aaa69d;
  font-size:11px;
}

.meal-data strong{
  display:block;
  font-size:15px;
}

.meal-detail{
  margin-top:7px;

  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.meal-chip{
  padding:5px 7px;

  border-radius:7px;

  background:#f4f1eb;

  color:#76726a;

  font-size:9px;
}

.meal-memo{
  margin-top:9px;

  color:#747067;

  font-size:11px;
  line-height:1.55;

  white-space:pre-wrap;
}


/* =========================
   MORE
========================= */

.more-menu{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.more-item{
  width:100%;
  border:0;

  padding:15px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  text-align:left;

  border-radius:17px;
  background:#fff;

  border:1px solid var(--line);
}

.more-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.more-icon{
  width:38px;
  height:38px;

  display:grid;
  place-items:center;

  border-radius:12px;

  background:var(--sand-soft);
  color:#8d7042;
}

.more-icon svg{
  width:18px;
}

.more-item strong{
  display:block;
  font-size:13px;
}

.more-item small{
  display:block;
  margin-top:3px;

  color:var(--muted);
  font-size:9px;
}

.more-arrow{
  color:#bbb7ae;
}

.more-arrow svg{
  width:17px;
}


/* =========================
   BUDGET
========================= */

.budget-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:12px 0;

  border-bottom:1px solid var(--line);
}

.budget-row:last-child{
  border:0;
}

.budget-label{
  color:#6f6b63;
  font-size:12px;
}

.budget-total{
  color:var(--green);
  font-size:19px;
  font-weight:900;
}


/* =========================
   NOTES
========================= */

.note-box{
  min-height:120px;

  white-space:pre-wrap;

  color:#66635d;

  line-height:1.7;
  font-size:12px;
}


/* =========================
   MODAL
========================= */

.modal{
  display:none;

  position:fixed;
  z-index:200;

  inset:0;

  background:rgba(18,18,16,.48);

  align-items:flex-end;
  justify-content:center;

  backdrop-filter:blur(3px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:480px;

  max-height:90vh;
  overflow-y:auto;

  padding:18px 19px 30px;

  background:#fff;

  border-radius:26px 26px 0 0;
}

.modal-handle{
  width:42px;
  height:4px;

  margin:0 auto 17px;

  border-radius:999px;

  background:#ddd8d0;
}

.modal-box h3{
  margin:0 0 8px;

  font-size:20px;
  letter-spacing:-.4px;
}

.modal-box label{
  display:block;

  margin-top:14px;

  color:#747069;

  font-size:10px;
  font-weight:800;
}

.modal-box input,
.modal-box textarea,
.modal-box select{
  width:100%;

  margin-top:6px;
  padding:12px 13px;

  border:1px solid #dfdbd3;
  border-radius:12px;

  outline:none;

  background:#fbfaf7;

  color:#222;

  font-size:13px;
}

.modal-box textarea{
  min-height:95px;
  resize:vertical;
}

.modal-box input:focus,
.modal-box textarea:focus,
.modal-box select:focus{
  border-color:#8cb8b1;

  box-shadow:
    0 0 0 3px rgba(55,118,109,.08);
}

.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.save-btn{
  width:100%;
  border:0;

  margin-top:20px;
  padding:14px;

  border-radius:14px;

  background:var(--green);
  color:#fff;

  font-size:13px;
  font-weight:850;
}

.cancel-btn{
  width:100%;
  border:0;

  margin-top:7px;
  padding:13px;

  border-radius:14px;

  background:#efede8;
  color:#625f58;

  font-size:12px;
  font-weight:800;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:100;

  left:50%;
  bottom:10px;

  transform:translateX(-50%);

  width:calc(100% - 22px);
  max-width:458px;

  height:70px;
  padding:6px;

  display:grid;
  grid-template-columns:repeat(5,1fr);

  background:rgba(255,255,255,.95);

  border:1px solid rgba(225,220,211,.95);
  border-radius:23px;

  box-shadow:
    0 12px 35px rgba(32,30,26,.15);

  backdrop-filter:blur(14px);
}

.nav-btn{
  border:0;
  background:none;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:3px;

  color:#98948b;

  font-size:8px;
  font-weight:800;
}

.nav-icon{
  width:35px;
  height:29px;

  display:grid;
  place-items:center;

  border-radius:11px;
}

.nav-icon svg{
  width:19px;
}

.nav-btn.active{
  color:var(--green);
}

.nav-btn.active .nav-icon{
  background:var(--green-soft);
}


/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  body{
    padding:24px 0;
  }

  .app{
    border-radius:28px;
    min-height:calc(100vh - 48px);
    overflow:hidden;
  }

}
</style>
</head>


<body>

<div class="app">

  <!-- =========================
       HOME
  ========================== -->

  <div class="page active" id="page-home">

    <header class="hero">

      <div class="hero-top">

        <div class="brand">

          <div class="brand-mark">
            <i data-lucide="compass"></i>
          </div>

          <div class="logo">
            OUR TRAVEL
          </div>

        </div>

      </div>


      <div class="hero-bottom">

        <div class="hero-kicker">
          PHILIPPINES · PANGLAO
        </div>

        <h1>BOHOL</h1>

        <div class="hero-date">
          <span>2027.03.01 — 03.06</span>
          <span>·</span>
          <span>6 DAYS</span>
        </div>

        <div class="hero-chip">
          <i data-lucide="palmtree"></i>
          HENANN RESORT ALONA BEACH
        </div>

      </div>

    </header>


    <div class="trip-summary">

      <div class="summary-item">
        <div class="summary-icon">
          <i data-lucide="calendar-days"></i>
        </div>
        <strong>6 DAYS</strong>
        <span>03.01 — 03.06</span>
      </div>

      <div class="summary-item">
        <div class="summary-icon">
          <i data-lucide="moon"></i>
        </div>
        <strong>4 NIGHTS</strong>
        <span>+ DAY USE</span>
      </div>

      <div class="summary-item">
        <div class="summary-icon">
          <i data-lucide="hotel"></i>
        </div>
        <strong>3 STAYS</strong>
        <span>Panglao</span>
      </div>

    </div>


    <main class="content">

      <div class="section-header">

        <div class="section-title">

          <div class="section-icon">
            <i data-lucide="layout-grid"></i>
          </div>

          <div>
            <h2>Our Bohol</h2>
            <small>TRIP OVERVIEW</small>
          </div>

        </div>

      </div>


      <div class="home-menu">

        <button
          class="home-card"
          onclick="openPage('schedule')"
        >
          <div class="home-card-icon">
            <i data-lucide="map"></i>

function emptyMeal(){

  return {
    restaurant:"",
    time:"",
    location:"",
    reservation:"미정",
    price:0,
    memo:""
  };

}


function createDefaultMeals(){

  const meals = {};

  mealDates.forEach(date=>{

    meals[date] = {

      breakfast:emptyMeal(),
      lunch:emptyMeal(),
      dinner:emptyMeal()

    };

  });

  return meals;

}


defaultData.meals = createDefaultMeals();



/* =========================================================
   저장 데이터
========================================================= */

function clone(value){

  return JSON.parse(
    JSON.stringify(value)
  );

}


let travelData;


try{

  const saved =
    localStorage.getItem(
      "ourTravelDataV3"
    );

  travelData =
    saved
      ? JSON.parse(saved)
      : clone(defaultData);

}catch(e){

  travelData =
    clone(defaultData);

}



/* =========================================================
   이전 데이터와 호환 / 확정 항공 정보 적용
========================================================= */

function migrateData(){

  if(!travelData.schedule){

    travelData.schedule =
      clone(defaultData.schedule);

  }


  if(!travelData.hotels){

    travelData.hotels =
      clone(defaultData.hotels);

  }


  if(!travelData.meals){

    travelData.meals =
      createDefaultMeals();

  }


  mealDates.forEach(date=>{

    if(!travelData.meals[date]){

      travelData.meals[date] = {

        breakfast:emptyMeal(),
        lunch:emptyMeal(),
        dinner:emptyMeal()

      };

    }


    mealTypes.forEach(type=>{

      if(!travelData.meals[date][type]){

        travelData.meals[date][type] =
          emptyMeal();

      }

    });

  });


  if(!travelData.expenses){

    travelData.expenses =
      clone(defaultData.expenses);

  }


  if(!travelData.notes){

    travelData.notes =
      defaultData.notes;

  }


  if(!travelData.checklist){

    travelData.checklist =
      clone(defaultData.checklist);

  }


  /*
     항공권은 확정 정보이므로
     이전 데이터가 있어도 최신값 적용
  */

  travelData.flight =
    clone(defaultData.flight);


  saveData();

}


migrateData();

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}


function escapeValue(value){

  return escapeHTML(value)
    .replaceAll('"',"&quot;");

}

function openPage(page,button){

  document
    .querySelectorAll(".page")
    .forEach(el=>{
      el.classList.remove("active");
    });


  const target =
    document.getElementById(
      "page-" + page
    );


  if(target){

    target.classList.add("active");

  }


  document
    .querySelectorAll(".nav-btn")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  const navButton =
    button ||
    document.querySelector(
      '.nav-btn[data-page="' +
      page +
      '"]'
    );


  if(navButton){

    navButton.classList.add("active");

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  render();

}

function scheduleIcon(title){

  const value =
    String(title || "")
      .toLowerCase();


  if(
    value.includes("seoul") ||
    value.includes("bohol")
  ){
    return "plane";
  }


  if(
    value.includes("henann") ||
    value.includes("arrival")
  ){
    return "hotel";
  }


  if(
    value.includes("day use") ||
    value.includes("check out")
  ){
    return "luggage";
  }


  return "map-pin";

}

let selectedMealDate =
  "03.01";


function mealTypeName(type){

  if(type === "breakfast"){
    return "아침";
  }

  if(type === "lunch"){
    return "점심";
  }

  return "저녁";

}


function mealIcon(type){

  if(type === "breakfast"){
    return "coffee";
  }

  if(type === "lunch"){
    return "sun";
  }

  return "moon";
}


function renderMealTabs(){

  const box =
    document.getElementById(
      "mealDateTabs"
    );


  box.innerHTML = "";


  mealDates.forEach(date=>{

    const button =
      document.createElement(
        "button"
      );


    button.className =
      "date-tab" +
      (
        selectedMealDate === date
          ? " active"
          : ""
      );


    button.textContent =
      date;


    button.onclick = ()=>{

      selectedMealDate =
        date;

      renderMeals();

    };


    box.appendChild(button);

  });

}


function renderMeals(){

    document.getElementById(

  box.innerHTML = "";

/* =========================================================
   CHECKLIST
========================================================= */

function renderChecklist(){

  const box =
    document.getElementById(
      "checklistBox"
    );


  if(!box){
    return;
  }


  box.innerHTML = "";


  travelData.checklist.forEach(
    (item,index)=>{


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "budget-row";


      const left =
        document.createElement(
          "div"
        );


      left.style.display =
        "flex";

      left.style.alignItems =
        "center";

      left.style.gap =
        "10px";


      const checkbox =
        document.createElement(
          "input"
        );


      checkbox.type =
        "checkbox";

      checkbox.checked =
        item.done;

      checkbox.style.width =
        "18px";

      checkbox.style.height =
        "18px";


      checkbox.onchange = ()=>{

        travelData
          .checklist[index]
          .done =
          checkbox.checked;

        saveData();

      };


      const name =
        document.createElement(
          "span"
        );


      name.textContent =
        item.name;

      name.style.fontSize =
        "12px";


      if(item.done){

        name.style.textDecoration =
          "line-through";

        name.style.color =
          "#aaa69d";

      }


      left.appendChild(
        checkbox
      );

      left.appendChild(
        name
      );


      const del =
        document.createElement(
          "button"
        );


      del.className =
        "edit-btn";

      del.textContent =
        "삭제";


      del.onclick = ()=>{

        if(
          confirm(
            item.name +
            " 항목을 삭제할까요?"
          )
        ){

          travelData
            .checklist
            .splice(index,1);

          saveData();

          showMore(
            "checklist"
          );

        }

      };


      row.appendChild(left);
      row.appendChild(del);

      box.appendChild(row);

    }
  );

}



/* =========================================================
   MODAL
========================================================= */

let saveAction =
  null;


function openModal(
  title,
  html,
  callback
){

  document.getElementById(
    "modalTitle"
  ).textContent =
    title;


  document.getElementById(
    "modalContent"
  ).innerHTML =
    html;


  saveAction =
    callback;


  document.getElementById(
    "modal"
  ).classList.add(
    "show"
  );

}


function closeModal(){

  document.getElementById(
    "modal"
  ).classList.remove(
    "show"
  );

  saveAction =
    null;

}


function saveModal(){

  if(saveAction){

    saveAction();

  }


  saveData();

  closeModal();

  render();

}

      여행 메모
    </label>

    <textarea
      id="notesEdit"
      style="min-height:250px;"
    >${escapeHTML(
      travelData.notes
    )}</textarea>

    `,


    ()=>{

      travelData.notes =
        document.getElementById(
          "notesEdit"
        ).value;

    }

  );

}



/* =========================================================
   CHECKLIST ADD
========================================================= */

function addChecklist(){

  openModal(

    "체크리스트 추가",

    `

    <label>
      항목
    </label>

    <input
      id="checklistName"
      placeholder="예: 보조 배터리"
    >

    `,


    ()=>{

      const value =
        document.getElementById(
          "checklistName"
        )
        .value
        .trim();


      if(value){

        travelData.checklist.push({

          name:value,
          done:false

        });

      }

    }

  );

}



/* =========================================================
   ICON
========================================================= */

function refreshIcons(){

  if(window.lucide){

    lucide.createIcons();

  }

}



/* =========================================================
   RENDER
========================================================= */

function render(){

  renderFlight();

  renderSchedule();

  renderHotels();

  renderMeals();

  refreshIcons();

}



/* =========================================================
   MODAL BACKGROUND
========================================================= */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    e=>{

      if(
        e.target.id === "modal"
      ){

        closeModal();

      }

    }
  );



/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
