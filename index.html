<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OUR TRAVEL</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f4f2;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#222;
}

.app{
  max-width:480px;
  margin:auto;
  background:#fafaf8;
  min-height:100vh;
  padding-bottom:90px;
}


/* HERO */

.hero{
  padding:45px 22px 30px;
  background:#111;
  color:white;
}

.logo{
  font-size:12px;
  letter-spacing:4px;
  opacity:.65;
}

.hero h1{
  font-size:42px;
  margin:12px 0 4px;
  letter-spacing:-1px;
}

.hero .date{
  font-size:14px;
  opacity:.7;
}

.hero .days{
  margin-top:6px;
  font-size:13px;
  opacity:.5;
}


/* CONTENT */

section{
  padding:25px 18px 5px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.section-title h2{
  margin:0;
  font-size:21px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.04);
}

.label{
  font-size:11px;
  color:#999;
  letter-spacing:1px;
  margin-bottom:6px;
}

.big{
  font-size:18px;
  font-weight:700;
}

.sub{
  margin-top:6px;
  font-size:13px;
  color:#777;
  line-height:1.6;
}


/* BUTTON */

.edit{
  border:0;
  background:#eee;
  border-radius:10px;
  padding:7px 11px;
  font-size:12px;
  cursor:pointer;
}

.edit:active{
  transform:scale(.97);
}


/* ITINERARY */

.day{
  display:flex;
  gap:15px;
}

.day-number{
  min-width:48px;
}

.day-number strong{
  font-size:14px;
}

.day-number span{
  display:block;
  font-size:11px;
  color:#aaa;
  margin-top:3px;
}

.day-content{
  flex:1;
}

.day-content strong{
  font-size:15px;
}


/* FLIGHT */

.flight-route{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
}

.airport{
  font-size:25px;
  font-weight:800;
}

.arrow{
  color:#aaa;
}


/* HOTEL */

.hotel-price{
  margin-top:15px;
  padding-top:14px;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-between;
}

.hotel-price strong{
  font-size:18px;
}


/* BUDGET */

.budget-row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.budget-row:last-child{
  border:0;
}

.total{
  font-size:21px;
  font-weight:800;
}


/* CHECKLIST */

.check-item{
  display:flex;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.check-item:last-child{
  border:0;
}

.check-item input{
  width:20px;
  height:20px;
  margin-right:12px;
}


/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:72px;
  background:rgba(255,255,255,.96);
  border-top:1px solid #eee;

  display:flex;
  justify-content:space-around;
  align-items:center;

  backdrop-filter:blur(10px);
}

.bottom-nav button{
  border:0;
  background:none;
  font-size:12px;
  color:#888;
  cursor:pointer;
}

.bottom-nav button.active{
  color:#111;
  font-weight:700;
}


/* MODAL */

.modal{
  display:none;
  position:fixed;
  z-index:100;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.5);
  align-items:flex-end;
  justify-content:center;
}

.modal-box{
  width:100%;
  max-width:480px;
  background:white;
  padding:25px 20px 35px;
  border-radius:24px 24px 0 0;
}

.modal-box h3{
  margin-top:0;
}

.modal-box label{
  display:block;
  font-size:12px;
  color:#777;
  margin-top:15px;
}

.modal-box input,
.modal-box textarea{
  width:100%;
  margin-top:6px;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

.modal-box textarea{
  min-height:80px;
  resize:vertical;
}

.save-btn{
  width:100%;
  border:0;
  background:#111;
  color:white;
  padding:15px;
  margin-top:20px;
  border-radius:12px;
  font-size:15px;
  font-weight:700;
}

.cancel-btn{
  width:100%;
  border:0;
  background:#eee;
  padding:13px;
  margin-top:8px;
  border-radius:12px;
}

</style>
</head>


<body>

<div class="app">


<!-- HERO -->

<div class="hero">

<div class="logo">
OUR TRAVEL
</div>

<h1>BOHOL</h1>

<div class="date">
2027.03.01 — 03.06
</div>

<div class="days">
5박 6일 · Philippines
</div>

</div>



<!-- ITINERARY -->

<section id="schedule">

<div class="section-title">
<h2>여행 일정</h2>
</div>

<div id="scheduleList"></div>

</section>



<!-- FLIGHT -->

<section id="flight">

<div class="section-title">
<h2>항공</h2>
<button class="edit" onclick="editFlight()">수정</button>
</div>

<div class="card">

<div class="label">
OUTBOUND
</div>

<div class="flight-route">

<div>
<div class="airport">ICN</div>
<div class="sub" id="outTime"></div>
</div>

<div class="arrow">
→
</div>

<div style="text-align:right">
<div class="airport">TAG</div>
<div class="sub">BOHOL</div>
</div>

</div>

<div class="sub" id="outFlight"></div>

</div>


<div class="card">

<div class="label">
RETURN
</div>

<div class="flight-route">

<div>
<div class="airport">TAG</div>
<div class="sub" id="returnTime"></div>
</div>

<div class="arrow">
→
</div>

<div style="text-align:right">
<div class="airport">ICN</div>
<div class="sub">SEOUL</div>
</div>

</div>

<div class="sub" id="returnFlight"></div>

</div>

</section>



<!-- HOTEL -->

<section id="hotel">

<div class="section-title">

<h2>숙소</h2>

<button class="edit" onclick="editHotel()">
수정
</button>

</div>


<div class="card">

<div class="label">
MAIN RESORT
</div>

<div class="big" id="hotelName"></div>

<div class="sub" id="hotelDates"></div>

<div class="sub" id="hotelMemo"></div>

<div class="hotel-price">

<span>
숙박비
</span>

<strong id="hotelPrice"></strong>

</div>

</div>

</section>



<!-- BUDGET -->

<section id="budget">

<div class="section-title">

<h2>경비</h2>

<button class="edit" onclick="editBudget()">
수정
</button>

</div>


<div class="card">

<div class="budget-row">

<span>항공</span>

<strong id="budgetFlight"></strong>

</div>


<div class="budget-row">

<span>숙소</span>

<strong id="budgetHotel"></strong>

</div>


<div class="budget-row">

<span>투어</span>

<strong id="budgetTour"></strong>

</div>


<div class="budget-row">

<span>식비 / 기타</span>

<strong id="budgetFood"></strong>

</div>


<div class="budget-row">

<span>총 예상 경비</span>

<span class="total" id="budgetTotal"></span>

</div>

</div>

</section>



<!-- CHECKLIST -->

<section id="checklist">

<div class="section-title">

<h2>체크리스트</h2>

<button class="edit" onclick="addChecklist()">
추가
</button>

</div>

<div class="card" id="checklistBox"></div>

</section>


</div>



<!-- NAV -->

<div class="bottom-nav">

<button onclick="go('schedule')" class="active">
홈
</button>

<button onclick="go('schedule')">
일정
</button>

<button onclick="go('flight')">
항공
</button>

<button onclick="go('hotel')">
숙소
</button>

<button onclick="go('budget')">
경비
</button>

</div>



<!-- EDIT MODAL -->

<div class="modal" id="modal">

<div class="modal-box">

<h3 id="modalTitle">
수정
</h3>

<div id="modalContent"></div>

<button class="save-btn" onclick="saveModal()">
저장
</button>

<button class="cancel-btn" onclick="closeModal()">
취소
</button>

</div>

</div>



<script>

/* ==========================
   기본 여행 데이터
========================== */

const defaultData = {

hotel:{
  name:"South Palms Resort & Spa Panglao – MGallery Collection",
  checkin:"2027.03.02",
  checkout:"2027.03.05",
  price:1370000,
  memo:"3박 · 조식 포함 · ALL 공식 예약"
},

flight:{
  outbound:{
    flight:"항공편 미입력",
    time:"2027.03.01"
  },

  return:{
    flight:"항공편 미입력",
    time:"2027.03.06"
  }
},

expenses:{
  flight:0,
  tour:0,
  food:0
},

schedule:[

{
date:"03.01",
day:"DAY 1",
title:"SEOUL → BOHOL",
memo:"보홀 도착 · 공항 근처 가성비 숙소"
},

{
date:"03.02",
day:"DAY 2",
title:"SOUTH PALMS",
memo:"리조트 이동 · 체크인 · 휴식"
},

{
date:"03.03",
day:"DAY 3",
title:"BALICASAG",
memo:"발리카삭 호핑 투어"
},

{
date:"03.04",
day:"DAY 4",
title:"FREE DAY",
memo:"리조트에서 여유롭게 보내기"
},

{
date:"03.05",
day:"DAY 5",
title:"CHECK OUT",
memo:"South Palms 체크아웃 · 마지막 숙소 이동"
},

{
date:"03.06",
day:"DAY 6",
title:"BOHOL → SEOUL",
memo:"귀국"
}

],

checklist:[

{
name:"여권",
done:false
},

{
name:"항공권",
done:false
},

{
name:"수영복",
done:false
},

{
name:"선크림",
done:false
}

]

};



/* ==========================
   저장된 데이터 불러오기
========================== */

let travelData;

try{

const saved =
localStorage.getItem("ourTravelData");

travelData =
saved
? JSON.parse(saved)
: JSON.parse(JSON.stringify(defaultData));

}catch(e){

travelData =
JSON.parse(JSON.stringify(defaultData));

}



/* ==========================
   데이터 저장
========================== */

function saveData(){

localStorage.setItem(
"ourTravelData",
JSON.stringify(travelData)
);

}



/* ==========================
   가격 표시
========================== */

function won(number){

return "₩" +
Number(number || 0)
.toLocaleString("ko-KR");

}



/* ==========================
   전체 화면 그리기
========================== */

function render(){

/* HOTEL */

document.getElementById("hotelName")
.textContent =
travelData.hotel.name;

document.getElementById("hotelDates")
.textContent =
travelData.hotel.checkin +
" — " +
travelData.hotel.checkout;

document.getElementById("hotelMemo")
.textContent =
travelData.hotel.memo;

document.getElementById("hotelPrice")
.textContent =
won(travelData.hotel.price);


/* FLIGHT */

document.getElementById("outTime")
.textContent =
travelData.flight.outbound.time;

document.getElementById("outFlight")
.textContent =
travelData.flight.outbound.flight;

document.getElementById("returnTime")
.textContent =
travelData.flight.return.time;

document.getElementById("returnFlight")
.textContent =
travelData.flight.return.flight;


/* BUDGET */

document.getElementById("budgetFlight")
.textContent =
won(travelData.expenses.flight);

document.getElementById("budgetHotel")
.textContent =
won(travelData.hotel.price);

document.getElementById("budgetTour")
.textContent =
won(travelData.expenses.tour);

document.getElementById("budgetFood")
.textContent =
won(travelData.expenses.food);


const total =
Number(travelData.expenses.flight || 0)
+
Number(travelData.hotel.price || 0)
+
Number(travelData.expenses.tour || 0)
+
Number(travelData.expenses.food || 0);


document.getElementById("budgetTotal")
.textContent =
won(total);


renderSchedule();

renderChecklist();

}



/* ==========================
   일정
========================== */

function renderSchedule(){

const box =
document.getElementById("scheduleList");

box.innerHTML="";


travelData.schedule.forEach(
(item,index)=>{

const card =
document.createElement("div");

card.className="card";


card.innerHTML=`

<div class="day">

<div class="day-number">

<strong>
${item.date}
</strong>

<span>
${item.day}
</span>

</div>

<div class="day-content">

<strong>
${item.title}
</strong>

<div class="sub">
${item.memo}
</div>

<div style="margin-top:10px">

<button
class="edit"
onclick="editSchedule(${index})">

수정

</button>

</div>

</div>

</div>

`;

box.appendChild(card);

});

}



/* ==========================
   체크리스트
========================== */

function renderChecklist(){

const box =
document.getElementById("checklistBox");

box.innerHTML="";


travelData.checklist.forEach(
(item,index)=>{

const row =
document.createElement("div");

row.className="check-item";


const checkbox =
document.createElement("input");

checkbox.type="checkbox";

checkbox.checked=item.done;

checkbox.onchange=()=>{

travelData.checklist[index].done =
checkbox.checked;

saveData();

};


const text =
document.createElement("span");

text.textContent=item.name;

text.style.flex="1";


const del =
document.createElement("button");

del.className="edit";

del.textContent="삭제";

del.onclick=()=>{

if(confirm(
item.name +
" 항목을 삭제할까요?"
)){

travelData.checklist.splice(
index,
1
);

saveData();

renderChecklist();

}

};


row.appendChild(checkbox);

row.appendChild(text);

row.appendChild(del);

box.appendChild(row);

});

}



/* ==========================
   MODAL
========================== */

let saveAction=null;


function openModal(
title,
html,
callback
){

document.getElementById(
"modalTitle"
).textContent=title;

document.getElementById(
"modalContent"
).innerHTML=html;

saveAction=callback;

document.getElementById(
"modal"
).style.display="flex";

}


function closeModal(){

document.getElementById(
"modal"
).style.display="none";

saveAction=null;

}


function saveModal(){

if(saveAction){

saveAction();

}

saveData();

render();

closeModal();

}



/* ==========================
   숙소 수정
========================== */

function editHotel(){

openModal(

"숙소 수정",

`

<label>
숙소명
</label>

<input
id="editHotelName"
value="${escapeValue(travelData.hotel.name)}">


<label>
체크인
</label>

<input
id="editCheckin"
value="${escapeValue(travelData.hotel.checkin)}">


<label>
체크아웃
</label>

<input
id="editCheckout"
value="${escapeValue(travelData.hotel.checkout)}">


<label>
숙박비
</label>

<input
id="editHotelPrice"
type="number"
value="${travelData.hotel.price}">


<label>
메모
</label>

<textarea
id="editHotelMemo">${escapeHTML(travelData.hotel.memo)}</textarea>

`,

()=>{

travelData.hotel.name =
document.getElementById(
"editHotelName"
).value;

travelData.hotel.checkin =
document.getElementById(
"editCheckin"
).value;

travelData.hotel.checkout =
document.getElementById(
"editCheckout"
).value;

travelData.hotel.price =
Number(
document.getElementById(
"editHotelPrice"
).value
);

travelData.hotel.memo =
document.getElementById(
"editHotelMemo"
).value;

}

);

}



/* ==========================
   항공 수정
========================== */

function editFlight(){

openModal(

"항공 수정",

`

<label>
가는 날
</label>

<input
id="editOutTime"
value="${escapeValue(travelData.flight.outbound.time)}">


<label>
가는 편 항공편
</label>

<input
id="editOutFlight"
value="${escapeValue(travelData.flight.outbound.flight)}">


<label>
오는 날
</label>

<input
id="editReturnTime"
value="${escapeValue(travelData.flight.return.time)}">


<label>
오는 편 항공편
</label>

<input
id="editReturnFlight"
value="${escapeValue(travelData.flight.return.flight)}">

`,

()=>{

travelData.flight.outbound.time =
document.getElementById(
"editOutTime"
).value;

travelData.flight.outbound.flight =
document.getElementById(
"editOutFlight"
).value;

travelData.flight.return.time =
document.getElementById(
"editReturnTime"
).value;

travelData.flight.return.flight =
document.getElementById(
"editReturnFlight"
).value;

}

);

}



/* ==========================
   일정 수정
========================== */

function editSchedule(index){

const item =
travelData.schedule[index];


openModal(

"일정 수정",

`

<label>
날짜
</label>

<input
id="editScheduleDate"
value="${escapeValue(item.date)}">


<label>
DAY
</label>

<input
id="editScheduleDay"
value="${escapeValue(item.day)}">


<label>
제목
</label>

<input
id="editScheduleTitle"
value="${escapeValue(item.title)}">


<label>
내용
</label>

<textarea
id="editScheduleMemo">${escapeHTML(item.memo)}</textarea>

`,

()=>{

item.date =
document.getElementById(
"editScheduleDate"
).value;

item.day =
document.getElementById(
"editScheduleDay"
).value;

item.title =
document.getElementById(
"editScheduleTitle"
).value;

item.memo =
document.getElementById(
"editScheduleMemo"
).value;

}

);

}



/* ==========================
   경비 수정
========================== */

function editBudget(){

openModal(

"경비 수정",

`

<label>
항공
</label>

<input
type="number"
id="editBudgetFlight"
value="${travelData.expenses.flight}">


<label>
투어
</label>

<input
type="number"
id="editBudgetTour"
value="${travelData.expenses.tour}">


<label>
식비 / 기타
</label>

<input
type="number"
id="editBudgetFood"
value="${travelData.expenses.food}">

`,

()=>{

travelData.expenses.flight =
Number(
document.getElementById(
"editBudgetFlight"
).value
);

travelData.expenses.tour =
Number(
document.getElementById(
"editBudgetTour"
).value
);

travelData.expenses.food =
Number(
document.getElementById(
"editBudgetFood"
).value
);

}

);

}



/* ==========================
   체크리스트 추가
========================== */

function addChecklist(){

openModal(

"체크리스트 추가",

`

<label>
항목
</label>

<input
id="newChecklist"
placeholder="예: 여행자 보험">

`,

()=>{

const name =
document.getElementById(
"newChecklist"
).value.trim();

if(name){

travelData.checklist.push({

name:name,
done:false

});

}

}

);

}



/* ==========================
   메뉴 이동
========================== */

function go(id){

document.getElementById(id)
.scrollIntoView({
behavior:"smooth"
});

}



/* ==========================
   HTML 안전 처리
========================== */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}


function escapeValue(value){

return escapeHTML(value)
.replaceAll('"',"&quot;");

}



/* ==========================
   처음 실행
========================== */

render();

</script>

</body>
</html>
